<h2 mat-dialog-title class="dialog-title">{{ isEdit ? 'Edit exercise' : 'Add exercise' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <div mat-dialog-content>
    <div class="field">
      <label for="exerciseName">Exercise name</label>
      <input id="exerciseName" type="text" formControlName="exerciseName" placeholder="e.g. Bench press" />
    </div>

    <div class="field">
      <label for="muscleGroup">Muscle group</label>
      <input id="muscleGroup" type="text" formControlName="muscleGroup" placeholder="e.g. Chest" />
    </div>

    <div class="field">
      <label for="caloriesBurnedPerMinute">Calories burned / min</label>
      <input
        id="caloriesBurnedPerMinute"
        type="number"
        formControlName="caloriesBurnedPerMinute"
        min="0"
        step="0.1"
      />
    </div>

    @if (errorMessage) {
      <p class="form-error">{{ errorMessage }}</p>
    }
  </div>

  <div mat-dialog-actions>
    <button type="button" class="btn btn--outline" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn btn--filled" [disabled]="submitting">
      {{ submitting ? 'Saving…' : isEdit ? 'Save changes' : 'Add exercise' }}
    </button>
  </div>
</form>
