<h2 mat-dialog-title class="dialog-title">{{ isEdit ? 'Edit meal' : 'Log a meal' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <div mat-dialog-content>
    <div class="field">
      <label for="mealType">Meal type</label>
      <select id="mealType" formControlName="mealType">
        @for (type of mealTypes; track type) {
          <option [value]="type">{{ mealTypeLabel(type) }}</option>
        }
      </select>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="date">Date</label>
        <input id="date" type="date" formControlName="date" />
      </div>
      <div class="field">
        <label for="time">Time</label>
        <input id="time" type="time" formControlName="time" />
      </div>
    </div>

    @if (errorMessage) {
      <p class="form-error">{{ errorMessage }}</p>
    }
  </div>

  <div mat-dialog-actions align="end">
    <button type="button" class="btn btn--outline" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn btn--filled" [disabled]="submitting">
      {{ submitting ? 'Saving…' : isEdit ? 'Save changes' : 'Log meal' }}
    </button>
  </div>
</form>
