<h2 mat-dialog-title class="dialog-title">New workout plan</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <div mat-dialog-content>
    <div class="field">
      <label for="clientProfileId">Client</label>
      <select id="clientProfileId" formControlName="clientProfileId">
        <option [ngValue]="null" disabled>Select a client…</option>
        @for (client of data.clients; track client.clientProfileId) {
          <option [ngValue]="client.clientProfileId">{{ client.name }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label for="title">Title</label>
      <input id="title" type="text" formControlName="title" placeholder="e.g. Strength Block - Phase 1" />
    </div>

    @if (errorMessage) {
      <p class="form-error">{{ errorMessage }}</p>
    }
  </div>

  <div mat-dialog-actions align="end">
    <button type="button" class="btn btn--outline" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn btn--filled" [disabled]="submitting">
      {{ submitting ? 'Creating…' : 'Create plan' }}
    </button>
  </div>
</form>
