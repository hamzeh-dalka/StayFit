<div class="dashboard">
  <header class="dashboard__header">
    <h1 class="dashboard__title">Overview</h1>
    <p class="dashboard__subtitle">Platform stats at a glance.</p>
  </header>

  @if (loading) {
    <div class="state">
      <mat-progress-spinner mode="indeterminate" diameter="28"></mat-progress-spinner>
    </div>
  } @else {
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-card__value">{{ adminStats?.totalUsers ?? 0 }}</span>
        <span class="stat-card__label">Total users</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__value">{{ adminStats?.totalCoaches ?? 0 }}</span>
        <span class="stat-card__label">Coaches</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__value">{{ adminStats?.totalClients ?? 0 }}</span>
        <span class="stat-card__label">Clients</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__value">{{ adminStats?.totalFoodItems ?? 0 }}</span>
        <span class="stat-card__label">Food items</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__value">{{ adminStats?.totalExercises ?? 0 }}</span>
        <span class="stat-card__label">Exercises</span>
      </div>
    </div>
  }
</div>
