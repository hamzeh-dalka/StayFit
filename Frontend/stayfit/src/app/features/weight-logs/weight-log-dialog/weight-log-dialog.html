<h2 mat-dialog-title class="dialog-title">Log weight</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <div mat-dialog-content>
    <div class="field">
      <label for="weightKg">Weight (kg)</label>
      <input id="weightKg" type="number" formControlName="weightKg" min="20" max="400" step="0.1" />
    </div>

    <div class="field-row">
      <div class="field">
        <label for="date">Date</label>
        <input id="date" type="date" formControlName="date" />
      </div>
      <div class="field">
        <label for="time">Time</label>
        <input id="time" type="time" formControlName="time" />
      </div>
    </div>

    @if (errorMessage) {
      <p class="form-error">{{ errorMessage }}</p>
    }
  </div>

  <div mat-dialog-actions>
    <button type="button" class="btn btn--outline" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn btn--filled" [disabled]="submitting">
      {{ submitting ? 'Saving…' : 'Log weight' }}
    </button>
  </div>
</form>
