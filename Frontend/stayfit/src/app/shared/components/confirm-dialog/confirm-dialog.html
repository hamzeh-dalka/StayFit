<h2 mat-dialog-title class="confirm-dialog__title">{{ data.title }}</h2>
<div mat-dialog-content>
  <p class="confirm-dialog__message">{{ data.message }}</p>
</div>
<div mat-dialog-actions align="end">
  <button type="button" class="btn btn--outline" (click)="cancel()">{{ data.cancelLabel ?? 'Cancel' }}</button>
  <button type="button" class="btn btn--danger" (click)="confirm()">{{ data.confirmLabel ?? 'Confirm' }}</button>
</div>
